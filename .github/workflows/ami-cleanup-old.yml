name: AMI Cleanup - Remove Old Images

on:
  schedule:
    # Run monthly on the 1st at 3 AM UTC (always in dry-run mode for safety)
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - only list AMIs to delete without actually deleting'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      retention_count:
        description: 'Number of AMIs to keep per configuration (e.g., 3 keeps 3 newest rocky9, 3 newest rocky10, etc.)'
        required: false
        default: '3'
        type: string
env:
  AWS_REGION: us-west-2
  RETENTION_COUNT: ${{ inputs.retention_count || '3' }}
  # CRITICAL: Scheduled runs always use dry-run for safety
  # Manual runs respect the input parameter (default: true)
  DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run || 'true' }}

jobs:
  cleanup-amis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover families
        id: families
        shell: bash
        run: |
          families=$(for d in vm-images/aws/*/; do basename "$d"; done | paste -sd, -)
          echo "families=$families" >> "$GITHUB_OUTPUT"

      - name: Find and cleanup old AMIs per family
        env:
          FAMILIES: ${{ steps.families.outputs.families }}
        run: |
          echo "Starting AMI cleanup process"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Retention count: Keep ${{ env.RETENTION_COUNT }} newest AMIs per configuration"
          echo "Dry run: ${{ env.DRY_RUN }}"
          echo "Trigger: ${{ github.event_name }}"

          # Get account ID
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "Account ID: $account_id"

          echo "## AMI Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Retention Policy:** Keep ${{ env.RETENTION_COUNT }} newest AMIs per configuration" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ env.DRY_RUN }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Accumulate AMIs to delete across all families
          amis_to_delete="[]"

          IFS=',' read -ra families <<< "$FAMILIES"
          for family in "${families[@]}"; do
            pattern="${family}-packer-*"
            echo "---"
            echo "Family: $family (pattern: $pattern)"
            echo "### Family: $family" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Find all AMIs for this family owned by us
            all_amis=$(aws ec2 describe-images \
              --owners "$account_id" \
              --filters \
                "Name=name,Values=${pattern}" \
                "Name=state,Values=available" \
              --query "Images[*].{ImageId:ImageId,Name:Name,Result:Tags[?Key=='Name'].Value | [0],CreationDate:CreationDate}" \
              --output json)

            total_count=$(echo "$all_amis" | jq length)
            echo "Found $total_count total AMIs for $family"

            if [ "$total_count" -eq 0 ]; then
              echo "No AMIs found for $family"
              echo "**No AMIs found** matching pattern ${pattern}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            # Separate FAILED AMIs from regular AMIs. packer-build-and-test.sh
            # records PASSED/FAILED on the Name *tag* (the AMI name attribute
            # never changes), and normally deletes a failed build outright;
            # a -FAILED tag only remains when that deletion was skipped or failed.
            failed_amis=$(echo "$all_amis" | jq '[.[] | select((.Result // "") | endswith("-FAILED"))]')
            failed_count=$(echo "$failed_amis" | jq length)

            # Get non-FAILED AMIs for normal retention processing
            success_amis=$(echo "$all_amis" | jq '[.[] | select(((.Result // "") | endswith("-FAILED")) | not)]')

            echo "Found $failed_count FAILED AMIs for $family (will be marked for deletion)"
            if [ "$failed_count" -gt 0 ]; then
              echo "$failed_amis" | jq -r '.[] | "  🔴 FAILED: \(.ImageId) - \(.Name) (Created: \(.CreationDate))"'
            fi

            amis_to_delete=$(echo "$amis_to_delete" "$failed_amis" | jq -s 'add')

            # Add FAILED AMIs section if any exist
            if [ "$failed_count" -gt 0 ]; then
              echo "#### 🔴 FAILED AMIs (Always Deleted)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Found **$failed_count** FAILED AMIs that will be deleted regardless of retention policy:" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "$failed_amis" | jq -r '.[] | "- 🔴 **\(.ImageId)**: \(.Name) (Created: \(.CreationDate))"' >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Extract unique configurations (e.g., rocky9, rocky10)
            # AMI name format: <family>-packer-<config>-YYYYMMDD-HHmmss
            configs=$(echo "$success_amis" | jq -r '.[].Name' | sed "s/^${family}-packer-\(.*\)-[0-9]\{8\}-[0-9]\{6\}.*/\1/" | sort -u)

            echo "Found configurations for $family: $(echo $configs | tr '\n' ' ')"

            echo "#### Analysis by Configuration" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Process each configuration
            for config in $configs; do
              echo "Processing configuration: $family/$config"

              # Get all AMIs for this configuration, sorted by creation date (newest first)
              # Note: Using success_amis (excludes FAILED AMIs). Anchor on the
              # timestamp so "ubuntu26" does not also claim ubuntu26-gpu/-arm64.
              config_amis=$(echo "$success_amis" | jq -r --arg cfg "$config" --arg fam "$family" \
                '[.[] | select(.Name | test("^\($fam)-packer-\($cfg)-[0-9]{8}-[0-9]{6}"))] |
                 sort_by(.CreationDate) | reverse')

              config_count=$(echo "$config_amis" | jq length)
              echo "  Found $config_count AMIs for $family/$config"

              # Determine how many to keep and how many to delete
              keep_count=${{ env.RETENTION_COUNT }}
              if [ "$config_count" -le "$keep_count" ]; then
                echo "  Keeping all $config_count AMIs (at or below retention limit)"
                echo "$config_amis" | jq -r '.[] | "    ✅ KEEP: \(.ImageId) - \(.Name) (Created: \(.CreationDate))"'
                echo "**$config**: $config_count AMIs (keeping all)" >> $GITHUB_STEP_SUMMARY
                echo "$config_amis" | jq -r '.[] | "- ✅ **\(.ImageId)**: \(.Name) (Created: \(.CreationDate))"' >> $GITHUB_STEP_SUMMARY
              else
                delete_count=$((config_count - keep_count))
                echo "  Keeping $keep_count newest AMIs, marking $delete_count for deletion"

                # Get AMIs to keep (first N)
                config_keep=$(echo "$config_amis" | jq --arg keep "$keep_count" '[limit($keep | tonumber; .[])]')
                echo "$config_keep" | jq -r '.[] | "    ✅ KEEP: \(.ImageId) - \(.Name) (Created: \(.CreationDate))"'

                # Get AMIs to delete (skip the first N, take the rest)
                config_delete=$(echo "$config_amis" | jq --arg skip "$keep_count" '[.[] | select(. != null)] | .[$skip | tonumber:]')
                echo "$config_delete" | jq -r '.[] | "    ❌ DELETE: \(.ImageId) - \(.Name) (Created: \(.CreationDate))"'

                # Add to GitHub summary
                echo "**$config**: $config_count AMIs (keeping $keep_count, deleting $delete_count)" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Keep:" >> $GITHUB_STEP_SUMMARY
                echo "$config_keep" | jq -r '.[] | "- ✅ **\(.ImageId)**: \(.Name)"' >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Delete:" >> $GITHUB_STEP_SUMMARY
                echo "$config_delete" | jq -r '.[] | "- ❌ **\(.ImageId)**: \(.Name)"' >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY

                # Add to global delete list
                amis_to_delete=$(echo "$amis_to_delete" "$config_delete" | jq -s 'add')
              fi
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          done

          # Count total AMIs to delete
          delete_total=$(echo "$amis_to_delete" | jq length)
          echo "---"
          echo "Total AMIs to delete: $delete_total"

          if [ "$delete_total" -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Result:** No AMIs need to be deleted" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AMIs to Delete ($delete_total total)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ env.DRY_RUN }}" == "true" ]; then
            echo "DRY RUN - Would delete the following AMIs:"
            echo "$amis_to_delete" | jq -r '.[] | "Would delete: \(.ImageId) - \(.Name)"'

            echo "**DRY RUN - AMIs that would be deleted:**" >> $GITHUB_STEP_SUMMARY
            echo "$amis_to_delete" | jq -r '.[] | "- `\(.ImageId)`: \(.Name) (Created: \(.CreationDate))"' >> $GITHUB_STEP_SUMMARY
          else
            echo "Proceeding with AMI deletion..."

            # Keep track of results
            deleted_count=0
            failed_count=0

            echo "**AMI Deletion Results:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Process each AMI (use process substitution to avoid subshell issues)
            while read ami_id ami_name; do
              echo "Processing AMI: $ami_id ($ami_name)"

              # Get associated snapshots before deregistering
              snapshots=$(aws ec2 describe-images \
                --image-ids $ami_id \
                --query 'Images[0].BlockDeviceMappings[?Ebs.SnapshotId!=null].Ebs.SnapshotId' \
                --output text)

              echo "Associated snapshots: $snapshots"

              # Deregister AMI
              if aws ec2 deregister-image --image-id $ami_id; then
                echo "✅ Successfully deregistered AMI: $ami_id"
                echo "- ✅ **$ami_id**: $ami_name" >> $GITHUB_STEP_SUMMARY
                deleted_count=$((deleted_count + 1))

                # Delete associated snapshots
                if [ -n "$snapshots" ] && [ "$snapshots" != "None" ]; then
                  for snapshot_id in $snapshots; do
                    echo "Deleting snapshot: $snapshot_id"
                    if aws ec2 delete-snapshot --snapshot-id $snapshot_id; then
                      echo "✅ Successfully deleted snapshot: $snapshot_id"
                    else
                      echo "❌ Failed to delete snapshot: $snapshot_id"
                    fi
                  done
                fi
              else
                echo "❌ Failed to deregister AMI: $ami_id"
                echo "- ❌ **$ami_id**: $ami_name (FAILED)" >> $GITHUB_STEP_SUMMARY
                failed_count=$((failed_count + 1))
              fi

              # Add delay between operations to avoid rate limiting
              sleep 2
            done < <(echo "$amis_to_delete" | jq -r '.[] | "\(.ImageId) \(.Name)"')

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Summary:**" >> $GITHUB_STEP_SUMMARY
            echo "- Successfully deleted: $deleted_count AMIs" >> $GITHUB_STEP_SUMMARY
            echo "- Failed to delete: $failed_count AMIs" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup orphaned snapshots
        if: env.DRY_RUN != 'true'
        env:
          FAMILIES: ${{ steps.families.outputs.families }}
        run: |
          echo "Looking for orphaned snapshots from deleted AMIs..."

          # Find snapshots that are no longer associated with any AMI
          # This is a safety check for snapshots that might have been left behind

          account_id=$(aws sts get-caller-identity --query Account --output text)

          orphaned_snapshots="[]"
          IFS=',' read -ra families <<< "$FAMILIES"
          for family in "${families[@]}"; do
            family_snapshots=$(aws ec2 describe-snapshots \
              --owner-ids "$account_id" \
              --filters \
                "Name=description,Values=*${family}-packer-*" \
                "Name=status,Values=completed" \
              --query "Snapshots[*].{SnapshotId:SnapshotId,Description:Description,StartTime:StartTime}" \
              --output json)
            orphaned_snapshots=$(echo "$orphaned_snapshots" "$family_snapshots" | jq -s 'add')
          done

          snapshot_count=$(echo "$orphaned_snapshots" | jq length)
          echo "Found $snapshot_count snapshots"

          if [ "$snapshot_count" -gt 0 ]; then
            echo "Snapshots found:"
            echo "$orphaned_snapshots" | jq -r '.[] | "- \(.SnapshotId): \(.Description) (Created: \(.StartTime))"'

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Orphaned Snapshots:**" >> $GITHUB_STEP_SUMMARY
            echo "Found $snapshot_count snapshots" >> $GITHUB_STEP_SUMMARY

            # Note: Being conservative here - snapshots should have been deleted with AMIs
            # If these exist, they may be orphaned from failed deletions
            echo "Note: These snapshots should have been cleaned up with their AMIs"
            echo "Manual review recommended to verify they are truly orphaned" >> $GITHUB_STEP_SUMMARY
            echo "$orphaned_snapshots" | jq -r '.[] | "- `\(.SnapshotId)`: \(.Description)"' >> $GITHUB_STEP_SUMMARY
          else
            echo "No orphaned snapshots found"
          fi

      - name: Generate cleanup report
        if: always()
        run: |
          echo "AMI cleanup process completed"

          # Add final summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cleanup Process:** Completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY

          if [ "${{ env.DRY_RUN }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **This was a dry run** - No AMIs were actually deleted" >> $GITHUB_STEP_SUMMARY
            echo "To perform actual cleanup, run this workflow with dry_run=false" >> $GITHUB_STEP_SUMMARY
          fi
