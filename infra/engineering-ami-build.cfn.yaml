AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AMI build network for cloudberry-image-factory in Synx Engineering
  (260369602265, us-west-2). Builders and test instances run in two private
  subnets tagged Purpose=ami-build, reach the internet only through a NAT
  gateway that exists while NatEnabled=true, and are managed over Session
  Manager with no inbound access. Builds run locally with
  packer-build-and-test.sh under the operator's SSO session; GitHub has no AWS
  access.

Parameters:
  VpcCidr:
    Type: String
    Description: /24 for the build VPC; split into two /25 private subnets. Keep it outside the launcher's 10.0.0.0/16.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/24$
  NatCidr:
    Type: String
    Description: /28 secondary VPC block for the public subnet that holds the NAT gateway.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/28$
  NatEnabled:
    Type: String
    Description: >-
      true while builds run: creates the NAT gateway, its Elastic IP and the
      private default route. false removes them (nothing billed); builders then
      have no internet path and the harness refuses to start a build.
    AllowedValues: ["true", "false"]
    Default: "false"
  OwnerTag:
    Type: String
    Description: Value of the Owner tag (SynxTags tag policy, report-only).
    MinLength: 1

Conditions:
  NatOn: !Equals [!Ref NatEnabled, "true"]

Rules:
  EngineeringUsWest2Only:
    Assertions:
      - Assert: !Equals [!Ref AWS::AccountId, "260369602265"]
        AssertDescription: Deploy only to Synx Engineering (260369602265).
      - Assert: !Equals [!Ref AWS::Region, us-west-2]
        AssertDescription: Deploy only to us-west-2; the harness region is fixed.

Resources:
  # ---------------------------------------------------------------- network
  BuildVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: ami-build}
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  NatCidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref BuildVpc
      CidrBlock: !Ref NatCidr

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: ami-build}
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref BuildVpc
      InternetGatewayId: !Ref InternetGateway

  # The two build subnets. Private: no public IPs, and their only way out is
  # the NAT gateway (while NatEnabled=true) plus the S3 gateway endpoint.
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BuildVpc
      AvailabilityZone: us-west-2a
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 2, 7]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: ami-build-us-west-2a}
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BuildVpc
      AvailabilityZone: us-west-2b
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 2, 7]]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: ami-build-us-west-2b}
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  # Route table of the two build subnets. The logical ID predates the move to
  # private subnets; it is kept so the existing table and its associations are
  # updated in place rather than replaced.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref BuildVpc
      Tags:
        - {Key: Name, Value: ami-build-private}
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  DefaultRoute:
    Type: AWS::EC2::Route
    Condition: NatOn
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  SubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PublicRouteTable

  # S3 stays reachable (package mirrors, SSM agent updates) without NAT data
  # charges. Free; present whether or not NAT is on.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref BuildVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRouteTable]

  # Public subnet that holds only the NAT gateway.
  NatSubnet:
    Type: AWS::EC2::Subnet
    DependsOn: NatCidrBlock
    Properties:
      VpcId: !Ref BuildVpc
      AvailabilityZone: us-west-2a
      CidrBlock: !Ref NatCidr
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: ami-build-nat-us-west-2a}
        - {Key: Purpose, Value: ami-build-nat}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  NatRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref BuildVpc
      Tags:
        - {Key: Name, Value: ami-build-nat}
        - {Key: Purpose, Value: ami-build-nat}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  NatSubnetDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref NatRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  NatSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref NatSubnet
      RouteTableId: !Ref NatRouteTable

  # Released together with the NAT gateway: an unattached Elastic IP is billed.
  NatElasticIp:
    Type: AWS::EC2::EIP
    Condition: NatOn
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: ami-build-nat}
        - {Key: Purpose, Value: ami-build-nat}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: NatOn
    Properties:
      SubnetId: !Ref NatSubnet
      AllocationId: !GetAtt NatElasticIp.AllocationId
      Tags:
        - {Key: Name, Value: ami-build-nat}
        - {Key: Purpose, Value: ami-build-nat}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  # ------------------------------------------------------------ network ACL
  # Drata test 227 ignores rule order, so no inbound allow from 0.0.0.0/0 may
  # cover tcp 22 or 3389: the ranges below skip them instead of an allow-all.
  # Return traffic for outbound connections arrives on ephemeral ports, which
  # these ranges cover. DefaultNetworkControls applies the same inbound entries
  # to the VPC's default ACL.
  BuildNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref BuildVpc
      Tags:
        - {Key: Name, Value: ami-build}
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  AclInboundTcpBelowSsh:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref BuildNetworkAcl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 0, To: 21}

  AclInboundTcpBetween:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref BuildNetworkAcl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 23, To: 3388}

  AclInboundTcpAboveRdp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref BuildNetworkAcl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 3390, To: 65535}

  AclInboundUdp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref BuildNetworkAcl
      RuleNumber: 130
      Protocol: 17
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 0, To: 65535}

  AclInboundIcmp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref BuildNetworkAcl
      RuleNumber: 140
      Protocol: 1
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      Icmp: {Type: -1, Code: -1}

  AclOutboundAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref BuildNetworkAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  SubnetAAcl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref SubnetA
      NetworkAclId: !Ref BuildNetworkAcl

  SubnetBAcl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref SubnetB
      NetworkAclId: !Ref BuildNetworkAcl

  NatSubnetAcl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref NatSubnet
      NetworkAclId: !Ref BuildNetworkAcl

  # ------------------------------------------ default ACL and security group
  # CloudFormation cannot manage the VPC's default ACL or default security
  # group. This custom resource gives the default ACL the same inbound entries
  # as BuildNetworkAcl and removes every rule from the default security group.
  # It re-applies them whenever its properties change, which includes every
  # NatEnabled toggle, so drift is corrected at each build-period update. On
  # Create it saves the prior defaults in SSM Parameter Store (Intelligent-
  # Tiering: free Standard tier at this size); on Delete
  # (including a failed update's rollback) it restores them exactly.
  DefaultNetworkControlsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ami-build-default-network-controls
      Tags:
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: default-network-controls
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeSecurityGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkAclEntry
                  - ec2:DeleteNetworkAclEntry
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:Vpc: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/${BuildVpc}
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ami-build/default-network-controls/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt DefaultNetworkControlsLogGroup.Arn

  DefaultNetworkControlsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ami-build-default-network-controls
      RetentionInDays: 90
      Tags:
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  DefaultNetworkControlsFunction:
    Type: AWS::Lambda::Function
    DependsOn: DefaultNetworkControlsLogGroup
    Properties:
      FunctionName: ami-build-default-network-controls
      Description: Applies the build ACL's inbound entries to the VPC default ACL and empties the default security group.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt DefaultNetworkControlsRole.Arn
      Tags:
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}
      Code:
        ZipFile: |
          import json

          import boto3
          import cfnresponse

          ec2 = boto3.client("ec2")
          ssm = boto3.client("ssm")

          # Same inbound entries as BuildNetworkAcl: (rule, protocol, from, to).
          INBOUND = [
              (100, "6", 0, 21),
              (110, "6", 23, 3388),
              (120, "6", 3390, 65535),
              (130, "17", 0, 65535),
              (140, "1", None, None),
          ]
          SAVED = "/ami-build/default-network-controls/{vpc_id}"


          def defaults(vpc_id):
              acl = ec2.describe_network_acls(Filters=[
                  {"Name": "vpc-id", "Values": [vpc_id]},
                  {"Name": "default", "Values": ["true"]},
              ])["NetworkAcls"][0]
              group = ec2.describe_security_groups(Filters=[
                  {"Name": "vpc-id", "Values": [vpc_id]},
                  {"Name": "group-name", "Values": ["default"]},
              ])["SecurityGroups"][0]
              return acl, group


          def inbound(acl):
              """Removable inbound entries (32767 is the fixed deny-all)."""
              entries = []
              for entry in acl["Entries"]:
                  if entry["Egress"] or entry["RuleNumber"] >= 32767:
                      continue
                  kept = {key: entry[key] for key in (
                      "RuleNumber", "Protocol", "RuleAction", "CidrBlock",
                      "Ipv6CidrBlock", "PortRange", "IcmpTypeCode") if key in entry}
                  entries.append(kept)
              return entries


          def set_inbound(acl, entries):
              for entry in inbound(acl):
                  ec2.delete_network_acl_entry(
                      NetworkAclId=acl["NetworkAclId"], RuleNumber=entry["RuleNumber"], Egress=False)
              for entry in entries:
                  ec2.create_network_acl_entry(
                      NetworkAclId=acl["NetworkAclId"], Egress=False, **entry)


          def set_group(group, ingress, egress):
              if group["IpPermissions"]:
                  ec2.revoke_security_group_ingress(
                      GroupId=group["GroupId"], IpPermissions=group["IpPermissions"])
              if group["IpPermissionsEgress"]:
                  ec2.revoke_security_group_egress(
                      GroupId=group["GroupId"], IpPermissions=group["IpPermissionsEgress"])
              if ingress:
                  ec2.authorize_security_group_ingress(GroupId=group["GroupId"], IpPermissions=ingress)
              if egress:
                  ec2.authorize_security_group_egress(GroupId=group["GroupId"], IpPermissions=egress)


          def save_prior(vpc_id):
              """Record the defaults as found, once; a later save never overwrites."""
              name = SAVED.format(vpc_id=vpc_id)
              try:
                  ssm.get_parameter(Name=name)
                  return
              except ssm.exceptions.ParameterNotFound:
                  pass
              acl, group = defaults(vpc_id)
              state = {"acl": inbound(acl), "ingress": group["IpPermissions"],
                       "egress": group["IpPermissionsEgress"]}
              ssm.put_parameter(Name=name, Value=json.dumps(state), Type="String",
                                Tier="Intelligent-Tiering", Overwrite=False)


          def apply(vpc_id):
              acl, group = defaults(vpc_id)
              wanted = []
              for rule, protocol, low, high in INBOUND:
                  entry = {"RuleNumber": rule, "Protocol": protocol,
                           "RuleAction": "allow", "CidrBlock": "0.0.0.0/0"}
                  if protocol == "1":
                      entry["IcmpTypeCode"] = {"Type": -1, "Code": -1}
                  else:
                      entry["PortRange"] = {"From": low, "To": high}
                  wanted.append(entry)
              set_inbound(acl, wanted)
              set_group(group, [], [])
              return acl["NetworkAclId"], group["GroupId"]


          def restore(vpc_id):
              name = SAVED.format(vpc_id=vpc_id)
              try:
                  state = json.loads(ssm.get_parameter(Name=name)["Parameter"]["Value"])
              except ssm.exceptions.ParameterNotFound:
                  return
              acl, group = defaults(vpc_id)
              set_inbound(acl, state["acl"])
              set_group(group, state["ingress"], state["egress"])
              ssm.delete_parameter(Name=name)


          def handler(event, context):
              vpc_id = event["ResourceProperties"]["VpcId"]
              physical_id = "default-network-controls-" + vpc_id
              try:
                  data = {}
                  if event["RequestType"] == "Create":
                      save_prior(vpc_id)
                  if event["RequestType"] in ("Create", "Update"):
                      acl_id, group_id = apply(vpc_id)
                      data = {"DefaultAclId": acl_id, "DefaultSecurityGroupId": group_id}
                  elif event.get("PhysicalResourceId") == physical_id:
                      restore(vpc_id)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data,
                                   physicalResourceId=physical_id)
              except Exception as error:  # report every failure to CloudFormation
                  cfnresponse.send(event, context, cfnresponse.FAILED, {},
                                   physicalResourceId=event.get("PhysicalResourceId", physical_id),
                                   reason=str(error)[:500])

  DefaultNetworkControls:
    Type: Custom::DefaultNetworkControls
    # Runs after the ordinary network changes, which narrows the window in
    # which a later failure rolls back this resource.
    DependsOn:
      - SubnetAAcl
      - SubnetBAcl
      - NatSubnetAcl
      - SubnetARouteTable
      - SubnetBRouteTable
      - NatSubnetRouteTable
      - S3GatewayEndpoint
      - BuilderInstanceProfile
      - BuilderSecurityGroup
    Properties:
      ServiceToken: !GetAtt DefaultNetworkControlsFunction.Arn
      VpcId: !Ref BuildVpc
      # Any property change sends an Update, which re-applies the defaults:
      # every NatEnabled toggle, or a RulesVersion bump when INBOUND changes.
      NatEnabled: !Ref NatEnabled
      RulesVersion: "2026-09-26"

  # ------------------------------------------------------------ builders
  # Instance profile for Packer builders and harness test instances: Session
  # Manager only.
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ami-build-ssm
      Tags:
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ami-build-ssm
      Roles: [!Ref BuilderRole]

  # Security group for Packer builders: no inbound rules. Session Manager and
  # package downloads are outbound only.
  BuilderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ami-build-builder
      GroupDescription: AMI builders - no inbound; Session Manager and package downloads are outbound only
      VpcId: !Ref BuildVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - {Key: Name, Value: ami-build-builder}
        - {Key: Purpose, Value: ami-build-builder}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  # ------------------------------------------------------------ flow logs
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vpc/ami-build/flow-logs
      RetentionInDays: 90
      Tags:
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ami-build-vpc-flow-logs
      Tags:
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogGroup.Arn
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"

  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref BuildVpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - {Key: Purpose, Value: ami-build}
        - {Key: Owner, Value: !Ref OwnerTag}
        - {Key: Environment, Value: development}
        - {Key: Project, Value: cloudberry-image-factory}

Outputs:
  VpcId:
    Value: !Ref BuildVpc
  SubnetIds:
    Description: Private build subnets (Purpose=ami-build).
    Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]
  NatSubnetId:
    Value: !Ref NatSubnet
  NatEnabled:
    Value: !Ref NatEnabled
  BuilderInstanceProfile:
    Value: !Ref BuilderInstanceProfile
  BuilderSecurityGroupId:
    Value: !Ref BuilderSecurityGroup
  DefaultNetworkAclId:
    Value: !GetAtt DefaultNetworkControls.DefaultAclId
  DefaultSecurityGroupId:
    Value: !GetAtt DefaultNetworkControls.DefaultSecurityGroupId
