---
# Agentic AMI (Ubuntu 26.04 arm64) - Goss Validation Tests

# This file defines validation tests for the AMI to ensure all
# components are properly installed

# Include common tests
gossfile:
  ../../common/tests/common-users.yaml: {}
  ../../common/tests/common-docker.yaml: {}
  ../../common/tests/common-motd.yaml: {}

# System packages verification
package:
  # Version control and development tools
  git: {installed: true}
  glow: {installed: true}
  vim: {installed: true}
  wget: {installed: true}
  curl: {installed: true}
  make: {installed: true}
  unzip: {installed: true}
  tmux: {installed: true}

  # System utilities
  bc: {installed: true}
  htop: {installed: true}
  btop: {installed: true}
  bubblewrap: {installed: true}
  ripgrep: {installed: true}
  bat: {installed: true}
  bats: {installed: true}
  jq: {installed: true}
  gnupg: {installed: true}
  bind9-dnsutils: {installed: true}
  net-tools: {installed: true}
  rsync: {installed: true}
  sudo: {installed: true}
  time: {installed: true}
  tree: {installed: true}

  # Python
  python3: {installed: true}
  python3-venv: {installed: true}
  python3-pip: {installed: true}

  # Locale support
  language-pack-en: {installed: true}

  # Ansible
  ansible-core: {installed: true}

  # Azure CLI
  azure-cli: {installed: true}

  # Container runtime
  docker-ce: {installed: true}
  docker-ce-cli: {installed: true}
  containerd.io: {installed: true}

# NOTE: No `service: sshd` / `port: tcp:22` blocks here: Ubuntu 24.04 uses
# systemd socket activation for OpenSSH (ssh.socket listens on a dual-stack
# IPv6 socket and ssh.service is triggered on demand), which breaks the
# service-enabled and tcp4-listener assertions used on the RPM platforms.
# SSH health is asserted via the process and command checks below instead.

# User account verification
user:
  ubuntu:
    exists: true
    home: /home/ubuntu
    shell: /bin/bash

# Critical files and directories
file:
  # yq installation
  /usr/local/bin/yq:
    exists: true
    mode: "0755"
    filetype: file

  # Ubuntu-specific locale configuration. Noble's update-locale replaces
  # /etc/default/locale with a symlink to ../locale.conf (unlike jammy, where
  # it stays a regular file); goss reports symlinks as mode 0777, so no mode
  # assertion here. Contents are read through the symlink.
  /etc/default/locale:
    exists: true
    owner: root
    group: root
    filetype: symlink
    linked-to: ../locale.conf
    contents:
      - "LANG=en_US.UTF-8"
  /etc/locale.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "LANG=en_US.UTF-8"

  # Azure CLI installation (Microsoft APT repo)
  /usr/bin/az:
    exists: true
    filetype: file

  # Google Cloud CLI installation (tarball into /usr/local, symlinked)
  /usr/local/bin/gcloud:
    exists: true
    filetype: symlink
  /usr/local/google-cloud-sdk/bin/gcloud:
    exists: true
    filetype: file
  /etc/profile.d/gcloud.sh:
    exists: true
    mode: "0755"
    filetype: file
    contents:
      - "CLOUDSDK_PYTHON"

  # Starship prompt
  /usr/local/bin/starship:
    exists: true
    mode: "0755"
    filetype: file
  /etc/profile.d/starship.sh:
    exists: true
    mode: "0755"
    filetype: file

  # helm installation
  /usr/local/bin/helm:
    exists: true
    mode: "0755"
    filetype: file

  # kubectl installation
  /usr/local/bin/kubectl:
    exists: true
    mode: "0755"
    filetype: file

  # omnistrate-ctl installation
  /usr/local/bin/omnistrate-ctl:
    exists: true
    mode: "0755"
    filetype: file

  # omctl symlink (canonical upstream binary name)
  /usr/local/bin/omctl:
    exists: true
    filetype: symlink

  # gitleaks binary
  /usr/local/bin/gitleaks:
    exists: true
    mode: "0755"
    filetype: file

  # gitleaks pre-commit hook template (applied to new clones/inits)
  /etc/git-template/hooks/pre-commit:
    exists: true
    mode: "0755"
    filetype: file
    contents:
      - "gitleaks protect"

  # k9s installation
  /usr/local/bin/k9s:
    exists: true
    mode: "0755"
    filetype: file

  # kind installation
  /usr/local/bin/kind:
    exists: true
    mode: "0755"
    filetype: file

  # terraform installation
  /usr/local/bin/terraform:
    exists: true
    mode: "0755"
    filetype: file

  # opentofu installation
  /usr/local/bin/tofu:
    exists: true
    mode: "0755"
    filetype: file

  # uv installation (required by omnigent)
  /usr/local/bin/uv:
    exists: true
    mode: "0755"
    filetype: file

  # Node.js installation (required by omnigent harnesses)
  /usr/local/bin/node:
    exists: true
    filetype: file
  /usr/local/bin/npm:
    exists: true
    filetype: symlink

  # PI coding agent (per-user npm install, symlink into node_modules)
  /home/ubuntu/.local/bin/pi:
    exists: true
    filetype: symlink

  # Claude Code (per-user native installer, latest stable at build time)
  /home/ubuntu/.local/bin/claude:
    exists: true

  # Hermes Agent (per-user install, command link into ~/.hermes venv)
  /home/ubuntu/.local/bin/hermes:
    exists: true

  # OpenAI Codex CLI
  /home/ubuntu/.local/bin/codex:
    exists: true

  # GitHub Copilot CLI (per-user npm install)
  /home/ubuntu/.local/bin/copilot:
    exists: true

  # Google Gemini CLI (per-user npm install)
  /home/ubuntu/.local/bin/gemini:
    exists: true

  # Cursor Agent
  /home/ubuntu/.local/bin/cursor-agent:
    exists: true

  # Kimi Code CLI
  /home/ubuntu/.kimi-code/bin/kimi:
    exists: true

  # Google Antigravity CLI
  /home/ubuntu/.local/bin/agy:
    exists: true

  # xAI Grok CLI (per-user install, native path ~/.grok/bin)
  /home/ubuntu/.grok/bin/grok:
    exists: true

  # The grok installer's opportunistic /usr/local/bin symlinks are removed by
  # the provisioner (per-user scope); assert they stay gone.
  /usr/local/bin/grok:
    exists: false
  /usr/local/bin/agent:
    exists: false

  # age (file encryption)
  /usr/local/bin/age:
    exists: true
    mode: "0755"
    filetype: file
  /usr/local/bin/age-keygen:
    exists: true
    mode: "0755"
    filetype: file

  # sops (secrets management)
  /usr/local/bin/sops:
    exists: true
    mode: "0755"
    filetype: file

  # packer (HashiCorp APT repo)
  /usr/bin/packer:
    exists: true
    filetype: file

  # community.sops Ansible collection (installed system-wide)
  /usr/share/ansible/collections/ansible_collections/community/sops:
    exists: true
    filetype: directory

  # Omnigent (ubuntu user, uv tool install symlinks into its tools venv)
  /home/ubuntu/.local/bin/omnigent:
    exists: true
    filetype: symlink

  # direnv installation
  /usr/local/bin/direnv:
    exists: true
    mode: "0755"
    filetype: file
  /etc/profile.d/direnv.sh:
    exists: true
    mode: "0755"
    filetype: file

  # autoenv installation
  /opt/autoenv/activate.sh:
    exists: true
    filetype: file
  /etc/profile.d/autoenv.sh:
    exists: true
    mode: "0755"
    filetype: file

  # git-profile
  /usr/local/bin/git-profile:
    exists: true
    mode: "0755"
    filetype: file
  /etc/git-profiles.yaml:
    exists: true
    mode: "0644"
    filetype: file

  # zellij terminal multiplexer
  /usr/local/bin/zellij:
    exists: true
    mode: "0755"
    filetype: file

  # herdr agent multiplexer
  /usr/local/bin/herdr:
    exists: true
    mode: "0755"
    filetype: file

  # hwatch
  /usr/local/bin/hwatch:
    exists: true
    mode: "0755"
    filetype: file

  # zoxide
  /usr/local/bin/zoxide:
    exists: true
    mode: "0755"
    filetype: file
  /etc/profile.d/zoxide.sh:
    exists: true
    mode: "0755"
    filetype: file

  # bat symlink (Debian/Ubuntu install the binary as batcat)
  /usr/local/bin/bat:
    exists: true
    filetype: symlink

  # Go installation
  /opt/go/bin/go:
    exists: true
    filetype: file
  /etc/profile.d/go.sh:
    exists: true
    filetype: file

  # Dolt installation
  /usr/local/bin/dolt:
    exists: true
    mode: "0755"
    filetype: file

  # beads (bd) installation
  /usr/local/bin/bd:
    exists: true
    mode: "0755"
    filetype: file

  # Bun installation
  /usr/local/bin/bun:
    exists: true
    mode: "0755"
    filetype: file

  # OpenCode CLI (ubuntu user)
  /home/ubuntu/.opencode/bin/opencode:
    exists: true
    owner: ubuntu
    filetype: file

  # Cloudsmith CLI (ubuntu user, uv tool install → isolated tool venv + shim)
  /home/ubuntu/.local/bin/cloudsmith:
    exists: true
    owner: ubuntu
    filetype: symlink

  # SSH agent tmux persistence
  /etc/profile.d/ssh-agent-tmux.sh:
    exists: true
    mode: "0755"
    filetype: file
    contents:
      - "ssh_auth_sock"

  # Claude Code config (ubuntu user)
  /home/ubuntu/.claude/CLAUDE.md:
    exists: true
    owner: ubuntu
    filetype: file

  # Python venv
  /home/ubuntu/.venv/bin/python3:
    exists: true
    filetype: symlink
  /home/ubuntu/.venv/bin/pip:
    exists: true
    filetype: file

  # Swap file configuration
  /swapfile:
    exists: true
    mode: "0600"
    owner: root
    group: root
    filetype: file

  # Swap optimization settings
  /etc/sysctl.d/99-swap.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "vm.swappiness=10"
      - "vm.vfs_cache_pressure=50"

# Command execution tests (using full paths to avoid PATH issues)
command:
  # SSH listener check (replaces the port/service assertions — see note above)
  "ss -lnt | grep -E ':22\\s'":
    exit-status: 0
    timeout: 5000

  # Ubuntu-specific locale check
  "locale":
    exit-status: 0
    stdout: ["en_US.UTF-8"]
    timeout: 5000

  # glow (markdown viewer) functionality check
  "/usr/bin/glow --version":
    exit-status: 0
    stdout: ["glow"]
    timeout: 5000

  # yq functionality check
  "/usr/local/bin/yq --version":
    exit-status: 0
    stdout: ["yq"]
    timeout: 5000

  # Starship functionality check
  "/usr/local/bin/starship --version":
    exit-status: 0
    stdout: ["starship"]
    timeout: 5000

  # Azure CLI functionality check (Python-based, slow startup — generous timeout)
  "/usr/bin/az version":
    exit-status: 0
    stdout: ["azure-cli"]
    timeout: 30000

  # Google Cloud CLI functionality check (Python-based, slow startup — generous
  # timeout; CLOUDSDK_PYTHON set inline since goss does not source profile.d)
  "CLOUDSDK_PYTHON=/usr/bin/python3 /usr/local/bin/gcloud version":
    exit-status: 0
    stdout: ["Google Cloud SDK"]
    timeout: 30000

  # kubectl functionality check
  "/usr/local/bin/kubectl version --client":
    exit-status: 0
    stdout: ["Client Version"]
    timeout: 5000

  # kind functionality check
  "/usr/local/bin/kind version":
    exit-status: 0
    stdout: ["kind"]
    timeout: 5000

  # terraform functionality check
  # CHECKPOINT_DISABLE=1 skips the HashiCorp update check (a network call that
  # intermittently exceeds the goss timeout)
  "CHECKPOINT_DISABLE=1 /usr/local/bin/terraform version":
    exit-status: 0
    stdout: ["Terraform v"]
    timeout: 10000

  # opentofu functionality check (same network update-check concern)
  "CHECKPOINT_DISABLE=1 /usr/local/bin/tofu version":
    exit-status: 0
    stdout: ["OpenTofu v"]
    timeout: 10000

  # uv functionality check
  "/usr/local/bin/uv --version":
    exit-status: 0
    stdout: ["uv"]
    timeout: 5000

  # Node.js functionality check (must be 22.x for omnigent harnesses)
  "/usr/local/bin/node --version":
    exit-status: 0
    stdout: ["v22."]
    timeout: 5000

  # npm functionality check (npm's shebang invokes `node` by name, so
  # /usr/local/bin must be on PATH — goss otherwise runs with a minimal PATH)
  "PATH=/usr/local/bin:$PATH /usr/local/bin/npm --version":
    exit-status: 0
    timeout: 10000

  # Omnigent functionality check (verify binary is executable;
  # bare invocation launches an interactive session, so skip running it)
  "test -x /home/ubuntu/.local/bin/omnigent":
    exit-status: 0
    timeout: 5000

  # bubblewrap (required by omnigent to sandbox the Claude CLI)
  "/usr/bin/bwrap --version":
    exit-status: 0
    stdout: ["bubblewrap"]
    timeout: 5000

  # AI toolchain version checks. Each tool installs its latest stable release
  # at build time (nothing is pinned — see system_add_ai_toolchain.sh), so
  # these assert the version command runs and exits 0 for the ubuntu user
  # without matching specific version strings; the exact resolved versions
  # are captured in the packer build log and this goss run's output. goss
  # executes as root, so commands drop to the ubuntu user via sudo with HOME
  # set; PATH includes /usr/local/bin because the npm-based tools (pi,
  # copilot, gemini) use `env node` shebangs; stdin is closed because some
  # agent CLIs block reading it.

  # Claude Code version check (output is "<semver> (Claude Code)")
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/claude --version < /dev/null":
    exit-status: 0
    stdout: ["Claude Code"]
    timeout: 30000

  # PI coding agent version check (Earendil Works distribution)
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/pi --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # Hermes Agent version check
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/hermes --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # OpenAI Codex CLI version check
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/codex --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # GitHub Copilot CLI version check
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/copilot --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # Google Gemini CLI version check
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/gemini --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # Cursor Agent version check
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/cursor-agent --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # Kimi Code CLI version check (current native CLI, not the legacy Python kimi-cli)
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.kimi-code/bin/kimi --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # Google Antigravity CLI — executable-only. `agy --version` needs a TTY
  # (bubbletea: "error opening TTY: could not open TTY: open /dev/tty: no
  # such device or address"), so no version command can run under goss.
  "test -x /home/ubuntu/.local/bin/agy":
    exit-status: 0
    timeout: 5000

  # xAI Grok CLI version check
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.grok/bin/grok --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # herdr version check (runs system-wide from /usr/local/bin)
  "/usr/local/bin/herdr --version < /dev/null":
    exit-status: 0
    timeout: 10000

  # age functionality check
  "/usr/local/bin/age --version":
    exit-status: 0
    timeout: 5000

  # sops functionality check (--disable-version-check skips the network call
  # sops otherwise makes to check for a newer release)
  "/usr/local/bin/sops --version --disable-version-check":
    exit-status: 0
    stdout: ["sops"]
    timeout: 5000

  # packer functionality check (CHECKPOINT_DISABLE skips the HashiCorp update
  # check, a network call that can exceed the goss timeout)
  "CHECKPOINT_DISABLE=1 /usr/bin/packer version":
    exit-status: 0
    stdout: ["Packer v"]
    timeout: 10000

  # ansible functionality check
  "/usr/bin/ansible --version":
    exit-status: 0
    stdout: ["ansible"]
    timeout: 10000

  # omnistrate-ctl functionality check
  "/usr/local/bin/omnistrate-ctl --version":
    exit-status: 0
    timeout: 5000


  # 1Password CLI check
  "op --version":
    exit-status: 0
    timeout: 5000

  # direnv check
  "/usr/local/bin/direnv version":
    exit-status: 0
    timeout: 5000

  # jq functionality check
  "jq --version":
    exit-status: 0
    stdout: ["jq"]
    timeout: 5000

  # bat functionality check (Debian/Ubuntu binary is batcat; symlinked to bat)
  "/usr/local/bin/bat --version":
    exit-status: 0
    stdout: ["bat"]
    timeout: 5000

  # Python venv pip check
  "/home/ubuntu/.venv/bin/pip --version":
    exit-status: 0
    stdout: ["pip"]
    timeout: 5000

  # Python dependencies in venv (omnistrate-cli-tools + synxdb-cli + check-jsonschema)
  "/home/ubuntu/.venv/bin/pip show rich click pyyaml pydantic pydantic-settings boto3 readchar typer httpx check-jsonschema":
    exit-status: 0
    timeout: 10000

  # check-jsonschema CLI works
  "/home/ubuntu/.venv/bin/check-jsonschema --version":
    exit-status: 0
    timeout: 5000

  # tmux functionality check (distro archive package; version tracks the
  # resolute archive, so assert only that a tmux 3.x answers)
  "/usr/bin/tmux -V":
    exit-status: 0
    stdout: ["tmux 3"]
    timeout: 5000

  # Go functionality check
  "/opt/go/bin/go version":
    exit-status: 0
    stdout: ["go version"]
    timeout: 5000

  # Dolt functionality check (first run initializes config, needs extra time)
  "/usr/local/bin/dolt version":
    exit-status: 0
    stdout: ["dolt version"]
    timeout: 30000

  # beads (bd) functionality check (verify binary is executable;
  # --version can hang in some shells)
  "test -x /usr/local/bin/bd":
    exit-status: 0
    timeout: 5000

  # Bun functionality check
  "/usr/local/bin/bun --version":
    exit-status: 0
    timeout: 5000

  # OpenCode CLI version check (as ubuntu user; see AI toolchain note above)
  "sudo -n -u ubuntu env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.opencode/bin/opencode --version < /dev/null":
    exit-status: 0
    timeout: 30000

  # Cloudsmith CLI: must run under PYTHONNOUSERSITE=1 (access-env / access run).
  # Goss already runs as the ubuntu user, so no sudo wrapper is needed.
  "env HOME=/home/ubuntu PYTHONNOUSERSITE=1 PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin /home/ubuntu/.local/bin/cloudsmith --version":
    exit-status: 0
    timeout: 30000

  # gitleaks functionality check
  "/usr/local/bin/gitleaks version":
    exit-status: 0
    timeout: 5000

  # Verify init.templatedir is configured system-wide
  "git config --system --get init.templatedir":
    exit-status: 0
    stdout: ["/etc/git-template"]
    timeout: 5000

  # Swap functionality tests
  "swapon --show":
    exit-status: 0
    stdout: ["/swapfile"]
    timeout: 5000

  "free -h | grep -i swap":
    exit-status: 0
    stdout: ["Swap:"]
    timeout: 5000

  # Verify swap settings are applied
  "sysctl vm.swappiness":
    exit-status: 0
    stdout: ["vm.swappiness = 10"]
    timeout: 5000

  "sysctl vm.vfs_cache_pressure":
    exit-status: 0
    stdout: ["vm.vfs_cache_pressure = 50"]
    timeout: 5000

# Process checks
process:
  sshd:
    running: true
