---
# Cloudberry Database Build AMI - Goss Validation Tests
# Amazon Linux 2023 (AL2023)

# This file defines validation tests for the AMI to ensure all
# components are properly installed

# System packages verification
package:
  # Version control and development tools (from system_add_cbdb_build_rpm_dependencies.sh)
  git: {installed: true}
  vim-common: {installed: true}
  tmux: {installed: true}
  wget: {installed: true}

  # System utilities
  rsync: {installed: true}
  sudo: {installed: true}

  # Development and build tools
  gcc: {installed: true}
  gcc-c++: {installed: true}
  cmake: {installed: true}
  bison: {installed: true}
  flex: {installed: true}

  # Libraries and development headers
  apr-devel: {installed: true}
  bzip2-devel: {installed: true}
  libcurl-devel: {installed: true}
  libevent-devel: {installed: true}
  libuuid-devel: {installed: true}
  libxml2-devel: {installed: true}
  libzstd-devel: {installed: true}
  openldap-devel: {installed: true}
  openssl-devel: {installed: true}
  pam-devel: {installed: true}
  readline-devel: {installed: true}
  zlib-devel: {installed: true}
  libuv-devel: {installed: true}
  libyaml-devel: {installed: true}

  # Perl
  perl-ExtUtils-Embed: {installed: true}
  perl-Opcode: {installed: true}

  # RPM tools
  rpm-build: {installed: true}
  rpm-sign: {installed: true}
  rpmdevtools: {installed: true}

  # Security and authentication
  krb5-devel: {installed: true}

  # Docker (from system_add_docker.sh)
  docker: {installed: true}

# System services verification
service:
  sshd:
    enabled: true
    running: true
  docker:
    enabled: true

# Network ports verification
port:
  # SSH should be listening
  tcp:22:
    listening: true
    ip: ["0.0.0.0"]

# User account verification
user:
  gpadmin:
    exists: true
    home: /home/gpadmin
    shell: /bin/bash
  cbadmin:
    exists: true
    home: /home/cbadmin
    shell: /bin/bash
  ec2-user:
    exists: true
    home: /home/ec2-user
    shell: /bin/bash

# Critical files and directories
file:
  # Go installation (from system_add_golang.sh)
  /opt/go/bin/go:
    exists: true
    mode: "0755"
    filetype: file
  /opt/go1.25.1:
    exists: true
    filetype: directory
  /opt/go:
    exists: true
    filetype: symlink
  /etc/profile.d/go.sh:
    exists: true
    mode: "0644"
    filetype: file
    contents:
      - "/opt/go/bin"

  # Xerces-C installation (from system_add_cbdb_xerces_c_build_dependency.sh)
  /opt/xerces-c/lib/libxerces-c.so:
    exists: true
    filetype: symlink
  /opt/xerces-c/include/xercesc:
    exists: true
    filetype: directory
  /opt/xerces-c/bin:
    exists: true
    filetype: directory

  # Goss installation (from system_add_goss.sh)
  /usr/local/bin/goss:
    exists: true
    mode: "0755"
    filetype: file

  # gpadmin user configuration
  /home/gpadmin:
    exists: true
    mode: "0700"
    owner: gpadmin
    group: gpadmin
    filetype: directory

  # gpadmin environment files
  /home/gpadmin/.bashrc:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: file
    contents:
      - "GOPATH"
      - "greenplum_path.sh"
  /home/gpadmin/.vimrc:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/.tmux.conf:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/bin:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: directory
  /home/gpadmin/bin/just:
    exists: true
    mode: "0755"
    owner: gpadmin
    group: gpadmin
    filetype: file

  # gpadmin SSH configuration
  /home/gpadmin/.ssh:
    exists: true
    mode: "0700"
    owner: gpadmin
    group: gpadmin
    filetype: directory
  /home/gpadmin/.ssh/id_ed25519:
    exists: true
    mode: "0600"
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/.ssh/id_ed25519.pub:
    exists: true
    mode: "0644"
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/.ssh/authorized_keys:
    exists: true
    mode: "0600"
    owner: gpadmin
    group: gpadmin
    filetype: file

  # cbadmin user configuration (from system_adduser_cbadmin.sh)
  /home/cbadmin:
    exists: true
    mode: "0700"
    owner: cbadmin
    group: cbadmin
    filetype: directory

  # cbadmin environment files (from cbadmin_configure_environment.sh)
  /home/cbadmin/.bashrc:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: file
    contents:
      - "GOPATH"
      - "greenplum_path.sh"
  /home/cbadmin/.vimrc:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/.tmux.conf:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/bin:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: directory
  /home/cbadmin/bin/just:
    exists: true
    mode: "0755"
    owner: cbadmin
    group: cbadmin
    filetype: file

  # SSH configuration (from cbadmin_configure_environment.sh)
  /home/cbadmin/.ssh:
    exists: true
    mode: "0700"
    owner: cbadmin
    group: cbadmin
    filetype: directory
  /home/cbadmin/.ssh/id_ed25519:
    exists: true
    mode: "0600"
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/.ssh/id_ed25519.pub:
    exists: true
    mode: "0644"
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/.ssh/authorized_keys:
    exists: true
    mode: "0600"
    owner: cbadmin
    group: cbadmin
    filetype: file

  # System configuration files
  /etc/security/limits.d/90-db-gpadmin-limits.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "gpadmin soft core unlimited"
      - "gpadmin hard core unlimited"
      - "gpadmin soft nofile 524288"
      - "gpadmin hard nofile 524288"
      - "gpadmin soft nproc 131072"
      - "gpadmin hard nproc 131072"

  /etc/security/limits.d/90-db-cbadmin-limits.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "cbadmin soft core unlimited"
      - "cbadmin hard core unlimited"
      - "cbadmin soft nofile 524288"
      - "cbadmin hard nofile 524288"
      - "cbadmin soft nproc 131072"
      - "cbadmin hard nproc 131072"

  # Kernel configurations (from system_add_kernel_configs.sh)
  /etc/sysctl.d/90-db-sysctl.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "kernel.msgmax = 65536"
      - "vm.overcommit_memory = 2"
      - "net.core.somaxconn = 10000"
  /var/crash:
    exists: true
    mode: "1777"
    filetype: directory

  # SELinux configuration (from system_disable_selinux.sh)
  /etc/selinux/config:
    exists: true
    filetype: file
    contents:
      - "SELINUX=disabled"

  # Sudo configuration
  /etc/sudoers.d/90-gpadmin:
    exists: true
    mode: "0440"
    owner: root
    group: root
    filetype: file
    contents:
      - "gpadmin ALL=(ALL) NOPASSWD:ALL"

  /etc/sudoers.d/90-cbadmin:
    exists: true
    mode: "0440"
    owner: root
    group: root
    filetype: file
    contents:
      - "cbadmin ALL=(ALL) NOPASSWD:ALL"

# Command execution tests (using full paths to avoid PATH issues)
command:
  # Go version check (from system_add_golang.sh)
  "/opt/go/bin/go version":
    exit-status: 0
    stdout: ["go1.25.1"]
    timeout: 5000

  # gpadmin user just command
  "sudo -u gpadmin /home/gpadmin/bin/just --version":
    exit-status: 0
    stdout: ["just"]
    timeout: 5000

  # gpadmin SSH key functionality
  "sudo -u gpadmin ssh-keygen -l -f /home/gpadmin/.ssh/id_ed25519.pub":
    exit-status: 0
    stdout: ["ED25519"]
    timeout: 5000

  # Verify gpadmin sudo access
  "sudo -l -U gpadmin":
    exit-status: 0
    stdout: ["NOPASSWD: ALL"]
    timeout: 5000

  # cbadmin user just command (from cbadmin_configure_environment.sh)
  "sudo -u cbadmin /home/cbadmin/bin/just --version":
    exit-status: 0
    stdout: ["just"]
    timeout: 5000

  # cbadmin SSH key functionality (from cbadmin_configure_environment.sh)
  "sudo -u cbadmin ssh-keygen -l -f /home/cbadmin/.ssh/id_ed25519.pub":
    exit-status: 0
    stdout: ["ED25519"]
    timeout: 5000

  # Verify cbadmin sudo access (from system_adduser_cbadmin.sh)
  "sudo -l -U cbadmin":
    exit-status: 0
    stdout: ["NOPASSWD: ALL"]
    timeout: 5000

  # Goss check (from system_add_goss.sh)
  "/usr/local/bin/goss --version":
    exit-status: 0
    stdout: ["goss version"]
    timeout: 5000

  # Docker functionality check (from system_add_docker.sh)
  "docker --version":
    exit-status: 0
    stdout: ["Docker version"]
    timeout: 5000

  # Test ec2-user docker group membership (from system_add_docker.sh)
  "groups ec2-user":
    exit-status: 0
    stdout: ["docker"]
    timeout: 5000

  # Test gpadmin docker group membership
  "groups gpadmin":
    exit-status: 0
    stdout: ["docker"]
    timeout: 5000

  # Test cbadmin docker group membership (from system_add_docker.sh)
  "groups cbadmin":
    exit-status: 0
    stdout: ["docker"]
    timeout: 5000

  # GitHub CLI check
  "gh --version":
    exit-status: 0
    stdout: ["gh version"]
    timeout: 5000

# Process checks
process:
  sshd:
    running: true

# Kernel parameter verification (sample of critical ones)
kernel-param:
  # Memory management
  vm.overcommit_memory:
    value: "2"
  vm.overcommit_ratio:
    value: "95"

  # Network settings
  net.core.somaxconn:
    value: "10000"
  net.ipv4.tcp_congestion_control:
    value: "cubic"
