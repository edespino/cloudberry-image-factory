---
# Cloudberry Database Build AMI - Goss Validation Tests for CentOS Stream 10

# This file defines validation tests for the AMI to ensure all
# components are properly installed and configured

# Include common tests
gossfile:
  ../../common/tests/common-users.yaml: {}
  ../../common/tests/common-security.yaml: {}
  ../../common/tests/common-docker.yaml: {}

# System packages verification
package:
  # Version control and development tools
  git: {installed: true}
  wget: {installed: true}
  tmux: {installed: true}
  unzip: {installed: true}

  # System utilities from EPEL
  htop: {installed: true}
  bat: {installed: true}
  jq: {installed: true}

# System services verification
service:
  sshd:
    enabled: true
    running: true

# Network ports verification
port:
  # SSH should be listening
  tcp:22:
    listening: true
    ip: ["0.0.0.0"]

# User account verification
user:
  ec2-user:
    exists: true
    home: /home/ec2-user
    shell: /bin/bash

# Critical files and directories
file:
  # yq installation
  /usr/local/bin/yq:
    exists: true
    mode: "0755"
    filetype: file

  # AWS CLI
  /usr/local/bin/aws:
    exists: true
    filetype: symlink

  # Goss testing framework
  /usr/local/bin/goss:
    exists: true
    mode: "0755"
    filetype: file

  # Docker systemd service
  /usr/lib/systemd/system/docker.service:
    exists: true
    filetype: file

  # Cloudberry MOTD generator
  /usr/local/sbin/cloudberry-motd:
    exists: true
    mode: "0755"
    filetype: file
    contains:
      - "Apache Cloudberry"

  # Cloudberry MOTD profile hook
  /etc/profile.d/10-cloudberry-motd.sh:
    exists: true
    mode: "0644"
    filetype: file

  # Swap file configuration
  /swapfile:
    exists: true
    mode: "0600"
    owner: root
    group: root
    filetype: file

  # Swap optimization settings
  /etc/sysctl.d/99-swap.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "vm.swappiness=10"
      - "vm.vfs_cache_pressure=50"

  # Timezone configuration
  /etc/localtime:
    exists: true
    filetype: symlink

# Command execution tests (using full paths to avoid PATH issues)
command:
  # yq functionality check
  "/usr/local/bin/yq --version":
    exit-status: 0
    stdout: ["yq"]
    timeout: 5000

  # AWS CLI functionality check
  "/usr/local/bin/aws --version":
    exit-status: 0
    stdout: ["aws-cli"]
    timeout: 10000

  # Package utilities
  "bat --version":
    exit-status: 0
    stdout: ["bat"]
    timeout: 5000

  "jq --version":
    exit-status: 0
    stdout: ["jq"]
    timeout: 5000

  "unzip -v":
    exit-status: 0
    stdout: ["UnZip"]
    timeout: 5000

  "git --version":
    exit-status: 0
    stdout: ["git version"]
    timeout: 5000

  # Goss testing framework
  "/usr/local/bin/goss --version":
    exit-status: 0
    stdout: ["goss version"]
    timeout: 5000

  # Swap functionality tests
  "swapon --show":
    exit-status: 0
    stdout: ["/swapfile"]
    timeout: 5000

  "free -h | grep -i swap":
    exit-status: 0
    stdout: ["Swap:"]
    timeout: 5000

  # Verify swap settings are applied
  "sysctl vm.swappiness":
    exit-status: 0
    stdout: ["vm.swappiness = 10"]
    timeout: 5000

  "sysctl vm.vfs_cache_pressure":
    exit-status: 0
    stdout: ["vm.vfs_cache_pressure = 50"]
    timeout: 5000

  # Timezone configuration tests
  "timedatectl show --property=Timezone --value":
    exit-status: 0
    stdout: ["America/Los_Angeles"]
    timeout: 5000

  "ls -la /etc/localtime":
    exit-status: 0
    stdout: ["zoneinfo/America/Los_Angeles"]
    timeout: 5000

# Process checks
process:
  sshd:
    running: true
