---
# Common User Configuration Tests
# This file is included by all platform-specific goss.yaml files
# to ensure consistent user setup testing across all platforms.
#
# Included by:
# - ubuntu22/tests/goss.yaml
# - rocky8/tests/goss.yaml
# - rocky9/tests/goss.yaml
# - al2023/tests/goss.yaml
#
# Tests for gpadmin and cbadmin users including:
# - User account existence and properties
# - Home directory and permissions
# - Environment configuration files
# - SSH key setup
# - Sudo access
# - Docker group membership

# User account verification
user:
  gpadmin:
    exists: true
    home: /home/gpadmin
    shell: /bin/bash
  cbadmin:
    exists: true
    home: /home/cbadmin
    shell: /bin/bash

# Critical files and directories
file:
  # gpadmin user configuration
  /home/gpadmin:
    exists: true
    mode: "0700"
    owner: gpadmin
    group: gpadmin
    filetype: directory

  # gpadmin environment files
  /home/gpadmin/.bashrc:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: file
    contents:
      - "GOPATH"
      - "greenplum_path.sh"
  /home/gpadmin/.vimrc:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/.tmux.conf:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/bin:
    exists: true
    owner: gpadmin
    group: gpadmin
    filetype: directory
  /home/gpadmin/bin/just:
    exists: true
    mode: "0755"
    owner: gpadmin
    group: gpadmin
    filetype: file

  # gpadmin SSH configuration
  /home/gpadmin/.ssh:
    exists: true
    mode: "0700"
    owner: gpadmin
    group: gpadmin
    filetype: directory
  /home/gpadmin/.ssh/id_ed25519:
    exists: true
    mode: "0600"
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/.ssh/id_ed25519.pub:
    exists: true
    mode: "0644"
    owner: gpadmin
    group: gpadmin
    filetype: file
  /home/gpadmin/.ssh/authorized_keys:
    exists: true
    mode: "0600"
    owner: gpadmin
    group: gpadmin
    filetype: file

  # cbadmin user configuration
  /home/cbadmin:
    exists: true
    mode: "0700"
    owner: cbadmin
    group: cbadmin
    filetype: directory

  # cbadmin environment files
  /home/cbadmin/.bashrc:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: file
    contents:
      - "GOPATH"
      - "greenplum_path.sh"
  /home/cbadmin/.vimrc:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/.tmux.conf:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/bin:
    exists: true
    owner: cbadmin
    group: cbadmin
    filetype: directory
  /home/cbadmin/bin/just:
    exists: true
    mode: "0755"
    owner: cbadmin
    group: cbadmin
    filetype: file

  # cbadmin SSH configuration
  /home/cbadmin/.ssh:
    exists: true
    mode: "0700"
    owner: cbadmin
    group: cbadmin
    filetype: directory
  /home/cbadmin/.ssh/id_ed25519:
    exists: true
    mode: "0600"
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/.ssh/id_ed25519.pub:
    exists: true
    mode: "0644"
    owner: cbadmin
    group: cbadmin
    filetype: file
  /home/cbadmin/.ssh/authorized_keys:
    exists: true
    mode: "0600"
    owner: cbadmin
    group: cbadmin
    filetype: file

# Command execution tests
command:
  # gpadmin user just command
  "sudo -u gpadmin /home/gpadmin/bin/just --version":
    exit-status: 0
    stdout: ["just"]
    timeout: 5000

  # gpadmin SSH key functionality
  "sudo -u gpadmin ssh-keygen -l -f /home/gpadmin/.ssh/id_ed25519.pub":
    exit-status: 0
    stdout: ["ED25519"]
    timeout: 5000

  # Verify gpadmin sudo access
  "sudo -l -U gpadmin":
    exit-status: 0
    stdout: ["NOPASSWD: ALL"]
    timeout: 5000

  # Test gpadmin Docker group membership
  "groups gpadmin":
    exit-status: 0
    stdout: ["docker"]
    timeout: 5000

  # cbadmin user just command
  "sudo -u cbadmin /home/cbadmin/bin/just --version":
    exit-status: 0
    stdout: ["just"]
    timeout: 5000

  # cbadmin SSH key functionality
  "sudo -u cbadmin ssh-keygen -l -f /home/cbadmin/.ssh/id_ed25519.pub":
    exit-status: 0
    stdout: ["ED25519"]
    timeout: 5000

  # Verify cbadmin sudo access
  "sudo -l -U cbadmin":
    exit-status: 0
    stdout: ["NOPASSWD: ALL"]
    timeout: 5000

  # Test cbadmin Docker group membership
  "groups cbadmin":
    exit-status: 0
    stdout: ["docker"]
    timeout: 5000
