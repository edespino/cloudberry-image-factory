---
# Cloudberry Database Build AMI - Goss Validation Tests (Debian 12)

# This file defines validation tests for the Debian 12 AMI to ensure all
# components are properly installed

# Include common tests
gossfile:
  ../../common/tests/common-golang.yaml: {}
  ../../common/tests/common-users.yaml: {}
  ../../common/tests/common-security.yaml: {}
  ../../common/tests/common-docker.yaml: {}

# System packages verification
package:
  # Version control and development tools
  git: {installed: true}
  vim: {installed: true}
  tmux: {installed: true}
  wget: {installed: true}
  curl: {installed: true}
  unzip: {installed: true}

  # System utilities
  htop: {installed: true}
  silversearcher-ag: {installed: true}  # Ubuntu package for ag
  iproute2: {installed: true}           # Ubuntu equivalent of net-tools
  lsof: {installed: true}               # Ubuntu equivalent of nmap-ncat
  rsync: {installed: true}
  sudo: {installed: true}

  # Development and build tools
  gcc-11: {installed: true}
  g++-11: {installed: true}
  make: {installed: true}
  maven: {installed: true}
  cmake: {installed: true}
  bison: {installed: true}
  flex: {installed: true}

  # Libraries and development headers
  libapr1-dev: {installed: true}
  libbz2-dev: {installed: true}
  libcurl4-gnutls-dev: {installed: true}
  libevent-dev: {installed: true}
  libldap-dev: {installed: true}
  libssl-dev: {installed: true}
  libpam0g-dev: {installed: true}
  libreadline-dev: {installed: true}
  zlib1g-dev: {installed: true}
  libuv1-dev: {installed: true}
  libyaml-dev: {installed: true}
  libxml2-dev: {installed: true}
  libzstd-dev: {installed: true}
  liblz4-dev: {installed: true}

  # Java - using system java installation

  # Python (Debian 12 uses Python 3.11)
  python3.11: {installed: true}
  python3.11-dev: {installed: true}
  python3-distutils: {installed: true}
  python3-setuptools: {installed: true}

  # Perl
  libperl-dev: {installed: true}
  libipc-run-perl: {installed: true}

  # Security and authentication
  libkrb5-dev: {installed: true}
  openssh-server: {installed: true}

  # Container runtime
  docker-ce: {installed: true}
  docker-ce-cli: {installed: true}
  containerd.io: {installed: true}

  # Additional Debian-specific packages
  locales: {installed: true}
  ca-certificates: {installed: true}
  apt-transport-https: {installed: true}

# System services verification
service:
  sshd:
    enabled: true
    running: true

# Network ports verification
port:
  # SSH should be listening
  tcp:22:
    listening: true
    ip: ["0.0.0.0"]

# User account verification
user:
  admin:
    exists: true
    home: /home/admin
    shell: /bin/bash

# Critical files and directories
file:
  # yq installation
  /usr/local/bin/yq:
    exists: true
    mode: "0755"
    filetype: file

  # Debian-specific locale configuration
  /etc/default/locale:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "LANG=en_US.UTF-8"

# Command execution tests (using full paths to avoid PATH issues)
command:
  # Java version check
  "java -version":
    exit-status: 0
    stderr: ["openjdk version"]
    timeout: 5000

  # yq functionality check
  "/usr/local/bin/yq --version":
    exit-status: 0
    stdout: ["yq"]
    timeout: 5000

  # AWS CLI check
  "/usr/local/bin/aws --version":
    exit-status: 0
    stdout: ["aws-cli"]
    timeout: 5000

  # Debian-specific locale check
  "locale":
    exit-status: 0
    stdout: ["en_US.UTF-8"]
    timeout: 5000

  # GCC version check (Debian uses gcc-11)
  "gcc --version":
    exit-status: 0
    stdout: ["gcc (Debian"]
    timeout: 5000

# Process checks
process:
  sshd:
    running: true
