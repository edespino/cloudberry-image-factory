---
# Cloudberry Database Build AMI - Goss Validation Tests for Rocky 10

# This file defines validation tests for the AMI to ensure all
# components are properly installed and configured

# Include common tests
gossfile:
  ../../common/tests/common-golang.yaml: {}
  ../../common/tests/common-users.yaml: {}
  ../../common/tests/common-security.yaml: {}
  ../../common/tests/common-motd.yaml: {}

# System packages verification
package:
  # Version control and development tools
  git: {installed: true}
  vim-enhanced: {installed: true}
  tmux: {installed: true}
  wget: {installed: true}

  # System utilities
  htop: {installed: true}
  bat: {installed: true}
  unzip: {installed: true}
  ripgrep: {installed: true}
  time: {installed: true}
  tree: {installed: true}

  # Node.js (npm is not a separate package in Rocky 10)
  nodejs: {installed: true}

# System services verification
service:
  sshd:
    enabled: true
    running: true

# Network ports verification
port:
  # SSH should be listening
  tcp:22:
    listening: true
    ip: ["0.0.0.0"]

# User account verification
user:
  rocky:
    exists: true
    home: /home/rocky
    shell: /bin/bash

# Critical files and directories
file:
  # yq installation
  /usr/local/bin/yq:
    exists: true
    mode: "0755"
    filetype: file

  # Starship prompt
  /usr/local/bin/starship:
    exists: true
    mode: "0755"
    filetype: file
  /etc/profile.d/starship.sh:
    exists: true
    mode: "0755"
    filetype: file

  # Goss testing framework
  /usr/local/bin/goss:
    exists: true
    mode: "0755"
    filetype: file

  # Claude CLI
  /usr/local/bin/claude:
    exists: true
    mode: "0755"
    filetype: file
  /home/gpadmin/.npm-global/bin/claude:
    exists: true
    mode: "0777"
    owner: gpadmin
    group: gpadmin
    filetype: symlink
  /home/cbadmin/.npm-global/bin/claude:
    exists: true
    mode: "0777"
    owner: cbadmin
    group: cbadmin
    filetype: symlink

  # SELinux configuration
  /etc/selinux/config:
    exists: true
    filetype: file
    contents:
      - "SELINUX=disabled"

  # Swap file configuration
  /swapfile:
    exists: true
    mode: "0600"
    owner: root
    group: root
    filetype: file

  # Swap optimization settings
  /etc/sysctl.d/99-swap.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "vm.swappiness=10"
      - "vm.vfs_cache_pressure=50"

  # Timezone configuration
  /etc/localtime:
    exists: true
    filetype: symlink

# Command execution tests (using full paths to avoid PATH issues)
command:
  # yq functionality check
  "/usr/local/bin/yq --version":
    exit-status: 0
    stdout: ["yq"]
    timeout: 5000

  # Starship functionality check
  "/usr/local/bin/starship --version":
    exit-status: 0
    stdout: ["starship"]
    timeout: 5000

  # Package utilities
  "bat --version":
    exit-status: 0
    stdout: ["bat"]
    timeout: 5000

  "unzip -v":
    exit-status: 0
    stdout: ["UnZip"]
    timeout: 5000

  "rg --version":
    exit-status: 0
    stdout: ["ripgrep"]
    timeout: 5000

  # Node.js (npm and other tools may not be ready during testing)
  "node --version":
    exit-status: 0
    stdout: ["v"]
    timeout: 5000

  # Goss testing framework
  "/usr/local/bin/goss --version":
    exit-status: 0
    stdout: ["goss version"]
    timeout: 5000

  # Swap functionality tests
  "swapon --show":
    exit-status: 0
    stdout: ["/swapfile"]
    timeout: 5000

  "free -h | grep -i swap":
    exit-status: 0
    stdout: ["Swap:"]
    timeout: 5000

  # Verify swap settings are applied
  "sysctl vm.swappiness":
    exit-status: 0
    stdout: ["vm.swappiness = 10"]
    timeout: 5000

  "sysctl vm.vfs_cache_pressure":
    exit-status: 0
    stdout: ["vm.vfs_cache_pressure = 50"]
    timeout: 5000

  # Timezone configuration tests
  "timedatectl show --property=Timezone --value":
    exit-status: 0
    stdout: ["America/Los_Angeles"]
    timeout: 5000

  "ls -la /etc/localtime":
    exit-status: 0
    stdout: ["zoneinfo/America/Los_Angeles"]
    timeout: 5000

# Process checks
process:
  sshd:
    running: true
