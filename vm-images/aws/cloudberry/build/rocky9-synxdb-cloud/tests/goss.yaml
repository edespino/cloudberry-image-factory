---
# Cloudberry Database Build AMI - Goss Validation Tests

# This file defines validation tests for the AMI to ensure all
# components are properly installed

# Include common tests
gossfile:
  ../../common/tests/common-users.yaml: {}
  ../../common/tests/common-docker.yaml: {}
  ../../common/tests/common-motd.yaml: {}

# System packages verification
package:
  # Version control and development tools
  git: {installed: true}
  vim-common: {installed: true}
  tmux: {installed: true}
  wget: {installed: true}
  curl: {installed: true}
  unzip: {installed: true}

  # System utilities
  htop: {installed: true}
  the_silver_searcher: {installed: true}
  bat: {installed: true}
  jq: {installed: true}
  gnupg2: {installed: true}
  bind-utils: {installed: true}
  net-tools: {installed: true}
  rsync: {installed: true}
  sudo: {installed: true}
  time: {installed: true}
  tree: {installed: true}

  # Python
  python3: {installed: true}

  # Container runtime
  docker-ce: {installed: true}
  docker-ce-cli: {installed: true}
  containerd.io: {installed: true}

# System services verification
service:
  sshd:
    enabled: true
    running: true

# Network ports verification
port:
  # SSH should be listening
  tcp:22:
    listening: true
    ip: ["0.0.0.0"]

# User account verification
user:
  rocky:
    exists: true
    home: /home/rocky
    shell: /bin/bash

# Critical files and directories
file:
  # yq installation
  /usr/local/bin/yq:
    exists: true
    mode: "0755"
    filetype: file

  # Starship prompt
  /usr/local/bin/starship:
    exists: true
    mode: "0755"
    filetype: file
  /etc/profile.d/starship.sh:
    exists: true
    mode: "0755"
    filetype: file

  # helm installation
  /usr/local/bin/helm:
    exists: true
    mode: "0755"
    filetype: file

  # kubectl installation
  /usr/local/bin/kubectl:
    exists: true
    mode: "0755"
    filetype: file

  # omnistrate-ctl installation
  /usr/local/bin/omnistrate-ctl:
    exists: true
    mode: "0755"
    filetype: file

  # Swap file configuration
  /swapfile:
    exists: true
    mode: "0600"
    owner: root
    group: root
    filetype: file

  # Swap optimization settings
  /etc/sysctl.d/99-swap.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "vm.swappiness=10"
      - "vm.vfs_cache_pressure=50"

# Command execution tests (using full paths to avoid PATH issues)
command:
  # yq functionality check
  "/usr/local/bin/yq --version":
    exit-status: 0
    stdout: ["yq"]
    timeout: 5000

  # Starship functionality check
  "/usr/local/bin/starship --version":
    exit-status: 0
    stdout: ["starship"]
    timeout: 5000

  # kubectl functionality check
  "/usr/local/bin/kubectl version --client":
    exit-status: 0
    stdout: ["Client Version"]
    timeout: 5000

  # omnistrate-ctl functionality check
  "/usr/local/bin/omnistrate-ctl --version":
    exit-status: 0
    timeout: 5000

  # jq functionality check
  "jq --version":
    exit-status: 0
    stdout: ["jq"]
    timeout: 5000

  # bat functionality check
  "bat --version":
    exit-status: 0
    stdout: ["bat"]
    timeout: 5000

  # Python pip check
  "python3 -m pip --version":
    exit-status: 0
    stdout: ["pip"]
    timeout: 5000

  # Python dependencies (omnistrate-cli-tools + synxdb-cli)
  "python3 -m pip show rich click pyyaml pydantic pydantic-settings boto3 readchar typer httpx":
    exit-status: 0
    timeout: 10000

  # Swap functionality tests
  "swapon --show":
    exit-status: 0
    stdout: ["/swapfile"]
    timeout: 5000

  "free -h | grep -i swap":
    exit-status: 0
    stdout: ["Swap:"]
    timeout: 5000

  # Verify swap settings are applied
  "sysctl vm.swappiness":
    exit-status: 0
    stdout: ["vm.swappiness = 10"]
    timeout: 5000

  "sysctl vm.vfs_cache_pressure":
    exit-status: 0
    stdout: ["vm.vfs_cache_pressure = 50"]
    timeout: 5000

# Process checks
process:
  sshd:
    running: true
