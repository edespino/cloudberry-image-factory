---
# Cloudberry Database Build AMI - Goss Validation Tests (Ubuntu 20.04)

# This file defines validation tests for the Ubuntu 20.04 AMI to ensure all
# components are properly installed

# Include common tests
gossfile:
  ../../common/tests/common-golang.yaml: {}
  ../../common/tests/common-users.yaml: {}
  ../../common/tests/common-security.yaml: {}
  ../../common/tests/common-docker.yaml: {}
  ../../common/tests/common-motd.yaml: {}

# System packages verification
package:
  # Version control (from build dependencies)
  git: {installed: true}

  # Container runtime (from system_add_docker.sh)
  docker-ce: {installed: true}
  docker-ce-cli: {installed: true}
  containerd.io: {installed: true}

# System services verification
service:
  sshd:
    enabled: true
    running: true

# Network ports verification
port:
  # SSH should be listening
  tcp:22:
    listening: true
    ip: ["0.0.0.0"]

# User account verification
user:
  ubuntu:
    exists: true
    home: /home/ubuntu
    shell: /bin/bash

# Critical files and directories
file:
  # Goss testing framework
  /usr/local/bin/goss:
    exists: true
    mode: "0755"
    filetype: file

  # Swap file configuration
  /swapfile:
    exists: true
    mode: "0600"
    owner: root
    group: root
    filetype: file

  # Swap optimization settings
  /etc/sysctl.d/99-swap.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "vm.swappiness=10"
      - "vm.vfs_cache_pressure=50"

# Command execution tests
command:
  # Goss testing framework
  "/usr/local/bin/goss --version":
    exit-status: 0
    stdout: ["goss version"]
    timeout: 5000

  # Swap functionality tests
  "swapon --show":
    exit-status: 0
    stdout: ["/swapfile"]
    timeout: 5000

  "free -h | grep -i swap":
    exit-status: 0
    stdout: ["Swap:"]
    timeout: 5000

  # Verify swap settings are applied
  "sysctl vm.swappiness":
    exit-status: 0
    stdout: ["vm.swappiness = 10"]
    timeout: 5000

  "sysctl vm.vfs_cache_pressure":
    exit-status: 0
    stdout: ["vm.vfs_cache_pressure = 50"]
    timeout: 5000

# Process checks
process:
  sshd:
    running: true
