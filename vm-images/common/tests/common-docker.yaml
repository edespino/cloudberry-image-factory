---
# Common Docker Configuration Tests
# This file is included by platform-specific goss.yaml files
# to ensure consistent Docker setup across platforms.
#
# Included by: run `grep -rl common-docker.yaml ../..` for the current list
#
# Note: rocky10 does not include this file (Docker not yet supported)
#
# Tests for:
# - Docker service enabled state
# - Docker configuration files
# - Docker version and functionality
# - Docker group membership for gpadmin/cbadmin

# System services verification
service:
  docker:
    enabled: true

# Docker configuration files
file:
  # Docker daemon configuration
  /etc/docker/daemon.json:
    exists: true
    mode: "0644"
    owner: root
    group: root
    filetype: file
    contents:
      - "default-shm-size"

# Command execution tests
command:
  # Docker version check
  "docker --version":
    exit-status: 0
    stdout: ["Docker version"]
    timeout: 5000

  # GitHub CLI check
  "gh --version":
    exit-status: 0
    stdout: ["gh version"]
    timeout: 5000

  # Test gpadmin Docker group membership
  "groups gpadmin":
    exit-status: 0
    stdout: ["docker"]
    timeout: 5000

  # Test cbadmin Docker group membership
  "groups cbadmin":
    exit-status: 0
    stdout: ["docker"]
    timeout: 5000
